services:
  postgres:
    image: postgres:16-alpine
    container_name: skillswap_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap_secret
      POSTGRES_DB: skillswap_db
    volumes:
      - skillswap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillswap -d skillswap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skillswap_pgdata:
    driver: local
